# SPDX-License-Identifier: MPL-2.0
# Copy the reviewed public source snapshot to its own repository before using.
# Manual build only. Artifacts are for review; this workflow never publishes.
name: Build Clearings installers for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: windows-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify public source and focused checks
        shell: bash
        run: |
          python -B packaging/build_native.py --output build-output --verify-only
          python -B -m unittest discover -s tests -p 'test_clearings_*.py'
          node tests/contract.test.cjs
          node tests/merge.test.cjs
          node tests/delivery.test.cjs
          node tests/plan_changes_cli.test.cjs
          node tests/preferences.test.cjs
          PYTHON=python node tests/clearings-release.test.cjs
      - name: Bundle local helper
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3
          python -B packaging/build_native.py --output build-output
          python -B packaging/test_native.py --dist build-output
      - name: Build Windows per-user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --version=3.13.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          New-Item -ItemType Directory -Path artifacts | Out-Null
          $compiler = @('C:\Program Files (x86)\NSIS\makensis.exe', 'C:\Program Files\NSIS\makensis.exe') |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'NSIS compiler missing' }
          & $compiler /V2 "/DSOURCE_DIR=$pwd\build-output" "/DOUTPUT_DIR=$pwd\artifacts" packaging\windows\Clearings.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $installer = Get-Item -LiteralPath 'artifacts\Clearings-Setup-0.4.3-Windows-x64.exe'
          python -B packaging/test_windows_installer.py --installer $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Running-helper installer lifecycle failed' }
      - name: Build macOS review image
        if: runner.os == 'macOS'
        run: python -B packaging/build_mac_dmg.py --dist build-output --output artifacts
      - name: Build and test Linux per-user installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -B packaging/build_linux_run.py --dist build-output --output artifacts
          test_home="$(mktemp -d)"
          HOME="$test_home" XDG_DATA_HOME="$test_home/.local/share" sh artifacts/Clearings-Install-0.4.3-Linux-x64.run
          HOME="$test_home" XDG_DATA_HOME="$test_home/.local/share" "$test_home/.local/bin/clearings" --version
          test -f "$test_home/.local/share/applications/Clearings.desktop"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearings-${{ matrix.name }}-unsigned-review
          path: artifacts/*
          if-no-files-found: error
